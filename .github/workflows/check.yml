name: Check offline examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: node --test tests/client.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: |
          for scenario in support-triage lead-scoring human-review; do
            node quickstart/node.mjs "$scenario"
            python quickstart/python.py "$scenario"
            bash quickstart/curl.sh "$scenario"
          done
